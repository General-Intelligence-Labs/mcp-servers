name: sudomcp/edstem
title: Ed Stem
description: Interact with Ed Discussion platform - view courses, threads, and participate in discussions
logo_url: "https://github.com/General-Intelligence-Labs/mcp-servers/blob/master/edstem/logo.png?raw=true"
config_schema:
  type: object
  properties:
    ed_api_token:
      type: string
  required: []
stdio_server_params:
  command: uv
  args:
    - "run"
    - "edstem"
  env:
    ED_API_TOKEN: "$ed_api_token"
